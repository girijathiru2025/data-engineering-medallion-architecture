name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyspark==3.5.1 pandas==2.2.2 pyarrow==15.0.2 \
                      yfinance curl_cffi boto3==1.34.69 \
                      pytest==8.1.1 pytest-cov==5.0.0 \
                      flake8 black

      - name: Lint (flake8)
        run: flake8 spark/ airflow/ --max-line-length=120 --ignore=E501,W503,E221,E241,E231,W504

      - name: Format check (black)
        run: black --check spark/ airflow/

      - name: Run unit tests
        run: pytest tests/ -v --cov=spark --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
