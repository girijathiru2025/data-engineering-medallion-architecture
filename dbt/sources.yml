version: 2

sources:
  - name: silver
    description: "Silver layer — cleansed and validated stock price data from PySpark"
    schema: silver
    tables:
      - name: stock_prices
        description: "Daily OHLCV stock prices, deduplicated and enriched with derived columns"
        columns:
          - name: date
            description: "Trading date"
            tests: [not_null]
          - name: ticker
            description: "Stock ticker symbol"
            tests: [not_null]
          - name: close
            description: "Closing price"
            tests: [not_null]
          - name: volume
            description: "Trading volume"
            tests: [not_null]
